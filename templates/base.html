<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShramikConnect{% endblock %}</title>

    <!-- Google Translate -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                autoDisplay: false
            }, 'gt_widget');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Hide Google top bar -->
    <style>
        .goog-te-banner-frame,
        .skiptranslate { display: none !important; }
        body { top: 0 !important; }
    </style>

    {% block head %}{% endblock %}
</head>
<body>

    <!-- Hidden Google Translate container -->
    <div id="gt_widget" style="display:none;visibility:hidden;position:absolute;left:-9999px;"></div>

    <!-- ✅ LANGUAGE RESTORE SYSTEM (FIXED + OPTIMIZED) -->
    <script>
        function applyLanguage() {
            const lang = localStorage.getItem('sc_language');

            if (lang && lang !== 'en') {
                const check = setInterval(function () {
                    if (typeof doGTranslate === 'function') {
                        doGTranslate('en|' + lang);
                        clearInterval(check);
                    }
                }, 200);

                setTimeout(function () {
                    clearInterval(check);
                }, 5000);
            }
        }

        // Normal page load
        window.addEventListener('load', applyLanguage);

        // Back / Forward navigation fix
        window.addEventListener('pageshow', function () {
            applyLanguage();
        });

        // Tab switch / app resume fix
        document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") {
                applyLanguage();
            }
        });
    </script>

    {% block content %}{% endblock %}

</body>
</html>
