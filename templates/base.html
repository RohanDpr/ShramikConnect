<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShramikConnect{% endblock %}</title>

    <!-- Google Translate — cookie-based, works on every page automatically -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                autoDisplay: false,
                multilanguagePage: true
            }, 'gt_widget');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Hide Google Translate top bar permanently -->
    <style>
        .goog-te-banner-frame.skiptranslate,
        .goog-te-banner-frame,
        #goog-gt-tt,
        .goog-tooltip,
        .goog-tooltip:hover,
        .goog-text-highlight { display: none !important; }
        body { top: 0 !important; position: static !important; }
        .skiptranslate { display: none !important; }
    </style>

    <!-- Apply saved language on every page load -->
    <script>
        // Back navigation → force reload so language applies fresh
        window.addEventListener('pageshow', function(e) {
            if (e.persisted) {
                window.location.reload();
            }
        });

        // On every page load → apply saved language
        window.addEventListener('load', function() {
            var lang = localStorage.getItem('sc_language');
            if (!lang || lang === 'en') return;
            var attempts = 0;
            var check = setInterval(function() {
                attempts++;
                if (typeof doGTranslate === 'function') {
                    doGTranslate('en|' + lang);
                    clearInterval(check);
                }
                if (attempts > 50) clearInterval(check);
            }, 100);
        });
    </script>

    {% block head %}{% endblock %}
</head>
<body>

    <!-- Google Translate widget — hidden but must exist in DOM -->
    <div id="gt_widget" style="display:none;visibility:hidden;position:absolute;left:-9999px;top:-9999px;"></div>

    {% block content %}{% endblock %}

</body>
</html>
