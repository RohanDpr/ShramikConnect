<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShramikConnect{% endblock %}</title>

    <!-- Google Translate async -->
    <script>
        function googleTranslateElementInit() {
            try {
                new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'gt_widget');
            } catch(e) {}
        }
        (function() {
            var s = document.createElement('script');
            s.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
            s.async = true;
            s.onerror = function() {};
            document.head.appendChild(s);
        })();
    </script>

    <style>
        .goog-te-banner-frame, .skiptranslate { display: none !important; }
        body { top: 0 !important; }
    </style>

    {% block head %}{% endblock %}
</head>

<body class="light">
<!--
    Yeh script body ke sabse pehle run hota hai — synchronously.
    CSS render hone se PEHLE sahi theme class lag jaati hai.
    Isliye koi flash ya wrong theme nahi aata.
-->
<script>
    (function() {
        var saved = localStorage.getItem('selectedTheme');
        var valid = ['light', 'dark', 'system'];
        var theme = (valid.indexOf(saved) !== -1) ? saved : 'light';
        document.body.className = theme;
    })();
</script>

    <div id="gt_widget" style="display:none;visibility:hidden;position:absolute;left:-9999px;"></div>

    {% block content %}{% endblock %}

</body>
</html>
